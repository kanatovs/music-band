<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Carti | Связь</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="main-header">
    <nav class="nav-menu">
        <a href="index.html">ГЛАВНАЯ</a>
        <a href="tour.html">АФИША</a>
        <a href="about.html">О ПРОЕКТЕ</a>
        <a href="contact.html">СВЯЗЬ</a>
    </nav>
</header>

<main class="container content-area">
    <h1>СВЯЗАТЬСЯ С НАМИ</h1>
    <p>Заполни форму, чтобы вступить в закрытое комьюнити слушателей.</p>

    <form action="#" method="get" class="booking-form">
        <div class="form-group">
            <label for="name">Твое имя:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="album">Любимый релиз:</label>
            <select id="album" name="album">
                <option value="weak">Всегда ненавидел быть слабым</option>
                <option value="eyes">Моими глазами</option>
                <option value="sorry">Тебе жаль это слышать</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Пару слов о музыке:</label>
            <textarea id="message" name="message" rows="5"></textarea>
        </div>

        <button type="submit" class="submit-btn">ОТПРАВИТЬ</button>
    </form>
</main>

<footer>
    <p>Team Members: Kanatov Sabyrzhan, Alikhan Zhaxylyk</p>
</footer>
</body>
</html>
